<section class="dashboard">
  <!-- ===========================================
       Dashboard Header
  ============================================ -->
  <header class="dashboard__header">
    <h2 class="dashboard__title">
      Welcome,
      {{ currentUser()?.fullName }} 👋
    </h2>
    <p class="dashboard__subtitle">Here's your banking overview.</p>
  </header>

  <!-- ===========================================
       Statistics Cards
  ============================================ -->
  <section class="dashboard__statistics">
    @for (card of statistics(); track card.title) {
      <app-stat-card [card]="card"></app-stat-card>
    }
  </section>

  <!-- ===========================================
       Quick Actions
  ============================================ -->
  <section class="dashboard__actions">
    <h3 class="dashboard__section-title">Quick Actions</h3>

    <div class="dashboard__action-grid">
      @for (action of quickActions; track action.title) {
        <app-action-card [action]="action"></app-action-card>
      }
    </div>
  </section>

  <!-- ===========================================
       Recent Transactions
  ============================================ -->
  <section class="dashboard__transactions">
    <app-recent-transactions [transactions]="transactions()">
    </app-recent-transactions>
  </section>
</section>
